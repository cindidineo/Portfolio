<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Issues JSON Viewer</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; padding: 24px; color:#111 }
    table { border-collapse: collapse; width: 100%; margin-top: 16px }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left }
    th { background: #f6f8fa }
    .null { color: #888 }
    .urgency-high { color: #b91c1c; font-weight: 600 }
    .urgency-medium { color: #b45309; font-weight: 600 }
    .urgency-low { color: #065f46; font-weight: 600 }
    .container { max-width: 1000px; margin: 0 auto }
    header { display:flex; justify-content:space-between; align-items:center }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Issues JSON Viewer</h1>
      <div><a id="raw-link" href="#" target="_blank">Open raw JSON</a></div>
    </header>

    <p>This page loads <code>json-website/issues.json</code> and displays the records in a table.</p>

    <div id="status">Loading…</div>
    <table id="issues-table" style="display:none">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Issue Type</th>
          <th>Urgency</th>
          <th>Summary</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    async function load() {
      const jsonPath = './json-website/issues.json';
      document.getElementById('raw-link').href = jsonPath;
      try {
        const res = await fetch(jsonPath, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        renderTable(data);
        document.getElementById('status').textContent = `Loaded ${data.length} records.`;
      } catch (err) {
        document.getElementById('status').textContent = 'Failed to load JSON: ' + err.message;
      }
    }

    function renderTable(data) {
      const tbody = document.querySelector('#issues-table tbody');
      tbody.innerHTML = '';
      data.forEach(item => {
        const tr = document.createElement('tr');

        const nameTd = document.createElement('td');
        nameTd.textContent = item.name ?? '—';
        if (item.name === null) nameTd.classList.add('null');
        tr.appendChild(nameTd);

        const emailTd = document.createElement('td');
        emailTd.textContent = item.email ?? '—';
        if (item.email === null) emailTd.classList.add('null');
        tr.appendChild(emailTd);

        const typeTd = document.createElement('td');
        typeTd.textContent = item.issue_type ?? '—';
        if (item.issue_type === null) typeTd.classList.add('null');
        tr.appendChild(typeTd);

        const urgencyTd = document.createElement('td');
        urgencyTd.textContent = item.urgency ?? '—';
        if (item.urgency === 'high') urgencyTd.classList.add('urgency-high');
        if (item.urgency === 'medium') urgencyTd.classList.add('urgency-medium');
        if (item.urgency === 'low') urgencyTd.classList.add('urgency-low');
        if (item.urgency === null) urgencyTd.classList.add('null');
        tr.appendChild(urgencyTd);

        const summaryTd = document.createElement('td');
        summaryTd.textContent = item.summary ?? '—';
        if (item.summary === null) summaryTd.classList.add('null');
        tr.appendChild(summaryTd);

        tbody.appendChild(tr);
      });

      document.getElementById('issues-table').style.display = '';
    }

    load();
  </script>
</body>
</html>
