<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AI Support Ticket</title>
    <style>
      body { background: #000; color: #00ff41; font-family: Consolas; padding: 40px; }
      .form { max-width: 600px; margin: auto; border: 1px solid #00ff41; padding: 24px; border-radius: 10px; }
      input, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #111; color: #00ff41; border: 1px solid #00ff41; box-sizing: border-box; }
      button { background: #00ff41; color: #000; padding: 12px; width: 100%; border: none; font-weight: bold; cursor: pointer; }
      #status { margin-top: 12px; }
    </style>
  </head>
  <body>
    <div class="form">
      <h2>AI Support Ticket</h2>
      <input id="name" placeholder="Your name (optional)">
      <input id="email" placeholder="Your email">
      <textarea id="message" placeholder="Describe your issue" rows="6"></textarea>
      <button id="submitBtn">Submit Ticket</button>
      <div id="status"></div>
    </div>

    <script>
      const submitBtn = document.getElementById('submitBtn');
      const status = document.getElementById('status');

      submitBtn.addEventListener('click', function() {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const message = document.getElementById('message').value.trim();
        if (!email || !message) {
          status.innerText = 'Please fill email and message.';
          return;
        }
        status.innerText = 'Processing...';
        submitBtn.disabled = true;

        // Call server-side Apps Script function
        google.script.run.withSuccessHandler(function(res) {
          submitBtn.disabled = false;
          if (res && res.status === 'OK') {
            status.innerText = '✅ Ticket submitted! Check your email for a reply.';
            // Optionally show summary or draft reply:
            console.log('AI summary:', res.summary);
          } else {
            status.innerText = 'Error: ' + (res && res.message ? res.message : 'Unknown');
            console.error('Error response:', res);
          }
        }).processTicket({ name: name, email: email, message: message });
      });
    </script>
  </body>
</html>
